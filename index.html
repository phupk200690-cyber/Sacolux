<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7fb">
  <title>Joke Break — Random Joke Generator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #172033;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 15% 15%, #e8eaff 0, transparent 34%),
                  radial-gradient(circle at 90% 85%, #ffe8d9 0, transparent 30%), #f6f7fb;
    }
    .card {
      width: min(100%, 560px);
      padding: clamp(28px, 6vw, 52px);
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 28px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 24px 80px rgba(39, 49, 88, .12);
      text-align: center;
    }
    .emoji { font-size: 46px; line-height: 1; }
    h1 { margin: 18px 0 8px; font-size: clamp(28px, 6vw, 40px); letter-spacing: -.04em; }
    .subtitle { margin: 0; color: #677085; }
    .joke-box {
      display: grid;
      min-height: 150px;
      place-items: center;
      margin: 30px 0 24px;
      padding: 24px;
      border-radius: 20px;
      background: #f4f5ff;
      color: #28314e;
      font-size: clamp(18px, 3vw, 22px);
      line-height: 1.65;
    }
    .joke-box[aria-busy="true"] { color: #77809a; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    button {
      min-height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, opacity .15s ease;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #a7adff; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .65; }
    .primary { background: #5956e9; color: white; box-shadow: 0 8px 20px rgba(89,86,233,.22); }
    .primary:hover:not(:disabled) { background: #4845d5; }
    .secondary { background: #eef0f6; color: #30394f; }
    .status { min-height: 22px; margin: 16px 0 0; color: #697287; font-size: 13px; }
    .status.error { color: #b42318; }
    .credit { margin-top: 20px; color: #8991a3; font-size: 12px; }
    .credit a { color: inherit; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="emoji" aria-hidden="true">😄</div>
    <h1 id="page-title">Need a laugh?</h1>
    <p class="subtitle">Get a fresh dad joke, straight from the internet.</p>

    <section id="joke" class="joke-box" aria-live="polite" aria-busy="true">
      Loading a joke…
    </section>

    <div class="actions">
      <button id="new-joke" class="primary" type="button">Tell me a joke</button>
      <button id="copy-joke" class="secondary" type="button" disabled>Copy joke</button>
    </div>
    <p id="status" class="status" role="status"></p>
    <p class="credit">Jokes provided by <a href="https://icanhazdadjoke.com/" target="_blank" rel="noopener noreferrer">icanhazdadjoke.com</a></p>
  </main>

  <script>
    const jokeElement = document.querySelector('#joke');
    const newJokeButton = document.querySelector('#new-joke');
    const copyJokeButton = document.querySelector('#copy-joke');
    const statusElement = document.querySelector('#status');
    let currentJoke = '';

    async function getJoke() {
      newJokeButton.disabled = true;
      copyJokeButton.disabled = true;
      jokeElement.setAttribute('aria-busy', 'true');
      jokeElement.textContent = 'Finding a good one…';
      statusElement.textContent = '';
      statusElement.classList.remove('error');

      try {
        const response = await fetch('https://icanhazdadjoke.com/', {
          headers: { Accept: 'application/json' },
          signal: AbortSignal.timeout(10000)
        });
        if (!response.ok) throw new Error(`Joke service returned ${response.status}`);
        const data = await response.json();
        if (typeof data.joke !== 'string' || !data.joke.trim()) throw new Error('The API returned an empty joke.');

        currentJoke = data.joke.trim();
        jokeElement.textContent = currentJoke;
        copyJokeButton.disabled = false;
      } catch (error) {
        currentJoke = '';
        jokeElement.textContent = 'Looks like the joke got lost on its way here. Please try again.';
        statusElement.textContent = 'Could not load a joke. Check your connection and try again.';
        statusElement.classList.add('error');
      } finally {
        jokeElement.setAttribute('aria-busy', 'false');
        newJokeButton.disabled = false;
      }
    }

    async function copyJoke() {
      if (!currentJoke) return;
      try {
        await navigator.clipboard.writeText(currentJoke);
        statusElement.textContent = 'Joke copied to clipboard!';
        statusElement.classList.remove('error');
      } catch {
        statusElement.textContent = 'Clipboard access is unavailable in this browser.';
        statusElement.classList.add('error');
      }
    }

    newJokeButton.addEventListener('click', getJoke);
    copyJokeButton.addEventListener('click', copyJoke);
    getJoke();
  </script>
</body>
</html>
